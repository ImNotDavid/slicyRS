# Production stack for a Linux host on the printers' network: the app (slicer included).
# Setup: ./deploy/install.sh   (or copy deploy/.env.example to .env, fill it in, then: docker compose up -d --build)
# Guide: deploy/DEPLOY.md
#
# Ways in, chosen by COMPOSE_PROFILES in .env:
#   - Cloudflare Tunnel run by this stack (COMPOSE_PROFILES=tunnel, TUNNEL_TOKEN set): the tunnel's Service URL is http://app:8000.
#   - Cloudflare Tunnel run elsewhere (COMPOSE_PROFILES empty): cloudflared on this host uses http://localhost:8000; a
#     cloudflared container in another stack must join this stack's network (<project>_default) and use http://app:8000; one on
#     another machine needs APP_BIND set to this machine's LAN address and http://<that address>:<APP_PORT>.
#   - Caddy (COMPOSE_PROFILES=caddy): Caddy does HTTPS on ports 80 and 443 for a DNS name or a LAN address (SITE_ADDRESS, CADDYFILE).
services:
  app:
    build: .
    env_file: .env
    environment:
      SLICY_DATA_DIR: /data
    volumes: ["slicyrs-data:/data"]
    ports: ["${APP_BIND:-127.0.0.1}:${APP_PORT:-8000}:8000"]   # where cloudflared reaches the app (see above)
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }

  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}     # from Cloudflare Zero Trust > Networks > Tunnels > your tunnel (cloudflared connector)
    depends_on:
      app: { condition: service_healthy }
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }

  caddy:
    profiles: ["caddy"]
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      # certificate served to visitors who send no server name (anyone who types an IP address)
      DEFAULT_SNI: ${DEFAULT_SNI:-${SITE_ADDRESS:-localhost}}
    volumes:
      - ./deploy/${CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app: { condition: service_healthy }
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }

volumes:
  slicyrs-data:
  caddy-data:
  caddy-config:
