# Production stack: the app (slicer included), reached through the Cloudflare Tunnel on the existing "shared-tunnel" network.
# Setup: ./deploy/install.sh   (or copy deploy/.env.example to .env, fill it in, then: docker compose up -d --build)
# Guide: deploy/DEPLOY.md
#
# The cloudflared container on the "shared-tunnel" network reaches the app at http://slicyrs:8000 (set that as the tunnel's
# Service URL). Cloudflare does HTTPS; no port is published on the host. The network must exist before starting
# (docker network create shared-tunnel).
# Optional: COMPOSE_PROFILES=caddy in .env adds Caddy for HTTPS on ports 80 and 443 instead (SITE_ADDRESS, CADDYFILE).
services:
  app:
    build: .
    env_file: .env
    environment:
      SLICY_DATA_DIR: /data
    volumes: ["slicyrs-data:/data"]
    networks:
      default: {}
      shared-tunnel:
        aliases: [slicyrs]       # a name other stacks on the shared network will not also use ("app" is too common)
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }

  caddy:
    profiles: ["caddy"]
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      # certificate served to visitors who send no server name (anyone who types an IP address)
      DEFAULT_SNI: ${DEFAULT_SNI:-${SITE_ADDRESS:-localhost}}
    volumes:
      - ./deploy/${CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app: { condition: service_healthy }
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }

networks:
  shared-tunnel:
    external: true

volumes:
  slicyrs-data:
  caddy-data:
  caddy-config:
