name: ci
on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests (mock slicer)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest -q -p no:cacheprovider
        working-directory: backend

  frontend:
    name: Frontend type check and build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  slicer-image:
    name: Docker image slices with the real engine
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t slicyrs:ci .
      # Runs the real-engine tests inside the image: every printer model must resolve its own start G-code, slices
      # must contain the printer's real start routine, and settings must reach the slicer. Fails if a slicer
      # upgrade (or a changed profile layout) silently breaks printing.
      - name: Slice inside the image
        run: >
          docker run --rm
          -v "${{ github.workspace }}/backend/tests:/srv/slicyrs/backend/tests:ro"
          -e SLICY_DATA_DIR=/tmp/data
          slicyrs:ci
          python3 -m pytest -q -p no:cacheprovider
          backend/tests/test_profile_fidelity.py backend/tests/test_real_engine.py
      - name: Server starts and reports the engine
        run: |
          docker run -d --name app -p 8000:8000 -e SECRET_KEY=ci -e PUBLIC_URL=http://localhost:8000 -e EMAIL_CONSOLE=1 slicyrs:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/api/health && break; sleep 2; done
          curl -fs localhost:8000/api/health | grep '"slicer_mode":"orca"'
